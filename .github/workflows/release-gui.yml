name: release-gui

# Tag-driven or manually dispatched GUI release. Builds desktop bundles (dmg / msi / appimage /
# deb) on each OS and attaches them to the SAME GitHub Release as the CLI binaries
# (release.yml). Frontend is static (gui/src), so there is no npm build step.
#
# Unsigned: no Apple signing secrets are set, so the macOS .app is not notarized.
# See README "Unsigned macOS app" for the Gatekeeper workaround.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (manual runs publish a test prerelease)
        type: choice
        required: true
        default: windows
        options:
          - windows
          - linux
          - macos
          - all

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.target || matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON('{
            "windows": [{"os": "windows-latest", "args": ""}],
            "linux": [{"os": "ubuntu-latest", "args": ""}],
            "macos": [
              {"os": "macos-14", "target": "aarch64-apple-darwin", "args": "--target aarch64-apple-darwin"},
              {"os": "macos-15-intel", "target": "x86_64-apple-darwin", "args": "--target x86_64-apple-darwin"}
            ],
            "all": [
              {"os": "macos-14", "target": "aarch64-apple-darwin", "args": "--target aarch64-apple-darwin"},
              {"os": "macos-15-intel", "target": "x86_64-apple-darwin", "args": "--target x86_64-apple-darwin"},
              {"os": "ubuntu-latest", "args": ""},
              {"os": "windows-latest", "args": ""}
            ]
          }')[inputs.platform || 'all'] }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS target
        if: startsWith(matrix.os, 'macos')
        run: rustup target add ${{ matrix.target }}

      # Tauri's Linux runtime + bundler deps (webkit, appindicator, rsvg, patchelf).
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev build-essential file wget curl \
            rpm
            # `rpm` provides rpmbuild so Tauri's "all" linux targets (deb + rpm +
            # appimage) all build; without it the rpm bundle silently fails/skips.

      # TODO: pin tauri-action to a commit SHA (matching this repo's pinning style)
      # once a known-good release is chosen; dependabot can then bump it.
      - name: Build + upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui/src-tauri
          # A separate tag per manual run/attempt keeps test assets immutable.
          # The test prefix also avoids triggering the v* production workflows.
          tagName: ${{ github.event_name == 'workflow_dispatch' && format('test-gui-{0}-{1}', github.run_id, github.run_attempt) || github.ref_name }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && format('unlocr test build {0} ({1}, attempt {2})', github.run_number, inputs.platform, github.run_attempt) || format('unlocr {0}', github.ref_name) }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' || contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
